<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repiw — Tap. Scan. Review.</title>
<style>
  :root{--brand:#3156d3;--navy:#0f1830;--ink:#17223b;--muted:#697386}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#e6ecff,#f6f7fb 60%);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
  .box{background:#fff;padding:44px;border-radius:24px;max-width:520px;box-shadow:0 24px 60px #1c2a4b18}
  h1{font-size:56px;margin:0;letter-spacing:-2px;color:var(--navy)}
  h1 span{color:var(--brand)}
  h2{font-weight:700;color:var(--brand);margin:8px 0 14px;font-size:19px}
  p{color:var(--muted);line-height:1.55}
  .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{border-radius:11px;padding:12px 18px;font-weight:700;text-decoration:none;font-size:14.5px;display:inline-block}
  .primary{background:var(--brand);color:#fff}
  .ghost{background:#eef1f7;color:var(--ink)}
  .badge{display:inline-block;font-size:12px;font-weight:800;color:var(--brand);background:#eef2ff;padding:5px 11px;border-radius:999px;margin-bottom:6px}
</style>
</head>
<body>
  <div class="box">
    <span class="badge">NFC + QR · Google Review</span>
    <h1>repiw<span>.</span></h1>
    <h2>Tap. Scan. Review.</h2>
    <p>Kartu NFC + QR untuk memudahkan pelanggan memberikan ulasan bisnis. Kelola kartu, aktivasi, dan statistik kunjungan dari satu dashboard.</p>
    <div class="links">
      <a class="btn primary" href="/admin">Admin Dashboard</a>
      <a class="btn ghost" href="/flow-preview">Flow Preview</a>
      <a class="btn ghost" href="/demo-review?card=RP-DEMO&src=qr">Halaman Review Demo</a>
    </div>
  </div>
</body>
</html>
